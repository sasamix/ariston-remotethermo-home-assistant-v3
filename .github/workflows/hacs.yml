name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # This fork is installed as a custom repository, not submitted to
          # hacs/default. These two checks require repository administration
          # and concern public-catalog inclusion, not package compatibility.
          # All manifest, branding, license and package checks remain enabled.
          ignore: "issues topics"
